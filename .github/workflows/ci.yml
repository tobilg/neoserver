name: CI

on:
  workflow_call:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  console:
    name: Console lint, tests, browser checks, build, and budget
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web/admin
    steps:
      - uses: actions/checkout@v7
      - name: Assert no local database state is tracked
        working-directory: .
        run: |
          tracked="$(git ls-files 'data/')"
          if [ -n "$tracked" ]; then
            echo "Runtime database state must not be committed:" >&2
            echo "$tracked" >&2
            exit 1
          fi
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/admin/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run check:ui-provenance
      - run: npm run check:form-schemas
      - run: git diff --exit-code -- src/lib/form-schemas.generated.json
      - run: npm run test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: npm run build
      - run: UI_TEST_BUILD=true npm run test:browser
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Test conformance reporting and browser accessibility
        working-directory: .
        run: |
          make test-conformance-report
          node --test scripts/conformance/report-browser.test.mjs
      - run: npm run check:budget
      - run: npm run test:build-tools
      - name: Test contributor tooling
        working-directory: .
        run: node --test scripts/dev.test.mjs

  # End-to-end runs against a real neoserver rather than route mocks, so it
  # needs Docker and is slower. Kept separate from the fast console lane: a
  # broken unit test should not wait on a container build, and neither gates
  # the protocol or conformance suites.
  console-e2e:
    name: Console end-to-end against a live server
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/admin/package-lock.json
      - name: Install console dependencies
        working-directory: web/admin
        run: npm ci
      - name: Install Playwright browser
        working-directory: web/admin
        run: npx playwright install --with-deps chromium
      - name: Resolve the OIDC issuer hostname
        # The issuer must be byte-identical from the browser on the host and
        # from the server inside the compose network, because neoserver pins
        # both issuer and audience.
        run: echo "127.0.0.1 keycloak" | sudo tee -a /etc/hosts
      - name: Run the live console suite
        run: ./scripts/console/run-e2e.sh
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: console-e2e-results
          path: |
            web/admin/test-results
            web/admin/playwright-report
          if-no-files-found: ignore

  openapi-drift:
    name: Management OpenAPI snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends libgdal-dev
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: go run ./cmd/neoserver openapi-dump --output web/admin/openapi.json
      - run: git diff --exit-code -- web/admin/openapi.json

  go-build-no-node:
    name: Go build uses embedded assets only
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends libgdal-dev
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: go build ./cmd/neoserver

  test:
    name: Go tests and vet
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      sql-security:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_PASSWORD: local-security-fixture
          POSTGRES_DB: postgis
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      NEOSRV_POSTGIS_SQL_TEST_DSN: postgres://postgres:local-security-fixture@127.0.0.1:5432/postgis?sslmode=disable
    steps:
      - uses: actions/checkout@v7
      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends libgdal-dev
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Run tests
        run: make test GO_TEST_FLAGS=-count=1
      - name: Run vet
        run: make vet
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Third-party license notices are current
        run: node scripts/third-party-licenses.mjs --check
      - name: Version literals agree
        run: node scripts/set-version.mjs --check
      - name: Authorization and cache race regressions
        run: make test-race

  release-container:
    name: Non-root image and durable paths
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: node --test scripts/release-evidence.test.mjs
      - run: docker build -t neoserver:candidate .
      - run: ./scripts/test-release-container.sh neoserver:candidate 0.1.1
      - name: Offline queries, released schema and format parity
        run: node scripts/test-runtime-container.mjs neoserver:candidate
      - name: Datum grids and image size budget
        run: |
          node scripts/test-proj-grids.mjs neoserver:candidate
          node scripts/check-runtime-image.mjs neoserver:candidate
      - name: Live WFS integrity and durable-cache regression
        run: node scripts/test-wfs-cache-container.mjs neoserver:candidate
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: runtime-container-evidence
          path: test-results/runtime-container
          if-no-files-found: ignore

  recovery:
    name: Restore and durable-state recovery
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends libgdal-dev
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: make test-recovery

  s3-lease:
    name: Conditional S3 lease on MinIO
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: make test-s3-lease-integration
