services:
  minio:
    # Official public multi-architecture manifest, verified 2026-09-15.
    # The old Docker Hub cpuv1 pin is no longer anonymously retrievable.
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    command: server /data
    environment:
      MINIO_ROOT_USER: neoserver-test
      MINIO_ROOT_PASSWORD: neoserver-test-secret
    ports:
      - "127.0.0.1:${NEOSRV_MINIO_PORT:-19000}:9000"
    volumes:
      - minio-data:/data

volumes:
  minio-data:
