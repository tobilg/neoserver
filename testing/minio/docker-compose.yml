services:
  minio:
    # MinIO no longer publishes public images (quay.io/minio/minio and
    # minio/minio refuse anonymous pulls). Chainguard's free build
    # is upstream MinIO RELEASE.2026-09-22T19-25-18Z; this digest is its
    # multi-architecture index, verified 2026-09-28.
    image: cgr.dev/chainguard/minio@sha256:6a1d0b45c8669726bba580ced0bfa4cb9fdeed1ed636dfabd81d1577beb6937b
    command: server /data
    environment:
      MINIO_ROOT_USER: neoserver-test
      MINIO_ROOT_PASSWORD: neoserver-test-secret
    ports:
      - "127.0.0.1:${NEOSRV_MINIO_PORT:-19000}:9000"
    volumes:
      - minio-data:/data

volumes:
  minio-data:
